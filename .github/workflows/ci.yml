name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: unit tests
        run: >
          uv run --with pytest --with firecrawl-anydoc==0.1.6
          --with pymupdf==1.28.0 --with pdf-inspector==0.2.6
          python -m pytest tests/ -q
      - name: verbatim block in sync with harvest.py
        run: python3 tests/check_sync.py
      - name: routing on the committed sample
        run: uv run skills/doc-extract/harvest.py example/sample-report.pdf
      - name: byte-identity gate, every format
        run: uv run eval/gate.py example/ tests/fixtures/
