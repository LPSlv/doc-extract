<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="img" aria-label="Cumulative tokens to answer questions about 14 datasheets: reading every page each time versus a cached artifact">
  <style>
    .lab  { font: 12px Charter, Georgia, serif; fill: #1a1a1a; }
    .val  { font: 11px "SF Mono", ui-monospace, monospace; fill: #1a1a1a; font-weight: 600; }
    .tick { font: 10px "SF Mono", ui-monospace, monospace; fill: #6b665d; }
    .ttl  { font: 13px Charter, Georgia, serif; fill: #1a1a1a; }
    .sub  { font: 11px Charter, Georgia, serif; fill: #8a857c; }
    .axis { stroke: #c8c2b5; stroke-width: .5; fill: none; }
  </style>
  <rect width="660" height="400" fill="#fafaf7"/>

  <text x="24" y="30" class="ttl">Cost of answering questions about 14 electronics datasheets (668 pages)</text>
  <text x="24" y="47" class="sub">Cumulative input tokens. Reading every page as an image costs the same again for every new question.</text>

  <!-- y axis, range frame -->
  <line x1="120" y1="73" x2="120" y2="320" class="axis"/>
  <text x="112" y="77" text-anchor="end" class="tick">32.5M</text>
  <text x="112" y="324" text-anchor="end" class="tick">0</text>

  <!-- naive: linear -->
  <polyline fill="none" stroke="#b3261e" stroke-width="1.6"
            points="120,307.7 212.6,258.4 328.4,196.8 444.2,135.2 560,73.6"/>
  <circle cx="560" cy="73.6" r="3" fill="#b3261e"/>
  <text x="552" y="66" text-anchor="end" class="lab" fill="#b3261e">read every page, every time</text>
  <text x="568" y="77" class="val" fill="#b3261e">32.5M</text>

  <!-- skill: near flat -->
  <polyline fill="none" stroke="#1a1a1a" stroke-width="1.6"
            points="120,314.9 212.6,314.4 328.4,314.0 444.2,313.5 560,313.1"/>
  <circle cx="560" cy="313.1" r="3" fill="#1a1a1a"/>
  <text x="568" y="316" class="val">0.92M</text>
  <text x="330" y="303" text-anchor="middle" class="lab">pdf-extract — convert once, then read text</text>

  <!-- x axis -->
  <line x1="120" y1="332" x2="560" y2="332" class="axis"/>
  <text x="120" y="348" text-anchor="middle" class="tick">1</text>
  <text x="328.4" y="348" text-anchor="middle" class="tick">10</text>
  <text x="560" y="348" text-anchor="middle" class="tick">20</text>
  <text x="340" y="366" text-anchor="middle" class="sub">questions asked</text>

  <line x1="24" y1="380" x2="636" y2="380" stroke="#d8d4cc" stroke-width=".5"/>
  <text x="24" y="394" class="sub">First question 59% cheaper; the tenth 20.7× cheaper. Pages render at the resolution their smallest text needs.</text>
</svg>
